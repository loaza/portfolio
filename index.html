<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Pich Sann, photographer and video artist based in Belgium.">
<style>html, body { margin: 0; } img { max-width: 100%; } [hidden] { display: none !important; }</style>
<title>Pich Sann</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@400;500&family=Jost:wght@300;400&family=Kantumruy+Pro:wght@300;400&display=swap">
<style>
  /* Layout: one centered column on a near-black wall, like a screening room; the work is the only object. */
  :root {
    --wall: #141414;
    --mark: #ecebe6;
    --link: #b9b9b4;
    --active: #9fb4bd;
    --current: #ffffff;
    --caption: #8f8f8a;
    --frame: #222222;
    --serif: "Cormorant SC", "Trajan Pro", "Cormorant Garamond", Georgia, serif;
    --sans: "Futura PT", "Jost", "Kantumruy Pro", Futura, "Century Gothic", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--wall); }
  body {
    background: var(--wall);
    color: var(--link);
    font-family: var(--sans);
    font-weight: 300;
    font-size: 14px;
    line-height: 1.7;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 120px;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; transition: color .25s ease; }
  a:hover { color: var(--active); }
  a:focus-visible, button:focus-visible { outline: 1px solid var(--link); outline-offset: 4px; }
  ::selection { background: var(--active); color: var(--link); }

  /* Header */
  header { text-align: center; padding-top: 40px; position: relative; }
  .wordmark {
    display: inline-block;
    font-family: var(--serif);
    font-weight: 500;
    font-size: 20px;
    letter-spacing: .32em;
    margin-right: -.32em;
    color: var(--mark);
    text-transform: uppercase;
  }
  .wordmark:hover { color: var(--mark); }
  nav.main {
    margin-top: 22px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 24px;
  }
  nav.main a, .overlay a {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--link);
  }
  nav.main a[aria-current="page"], .overlay a[aria-current="page"] {
    color: var(--current); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px;
  }
  .lang-row { max-width: 1100px; margin: 14px auto 0; display: flex; justify-content: flex-end; gap: 14px; }
  .lang[aria-pressed="true"] { color: var(--current); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
  /* Letter-spacing pulls Khmer clusters apart, so Khmer text is set without it. */
  html[lang="km"] body *:not(.wordmark) { letter-spacing: 0 !important; }
  .lang {
    background: none; border: 0; padding: 0; cursor: pointer;
    font-family: var(--sans); font-size: 11px; letter-spacing: .08em;
    color: var(--link); transition: color .25s ease;
  }
  .lang:hover { color: var(--active); }
  .menu-btn {
    display: none;
    margin: 18px auto 0;
    background: none; border: 0; padding: 4px 8px; cursor: pointer;
    font-family: var(--sans); font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--link);
  }
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    background: var(--wall);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
    opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .overlay a { font-size: 14px; }
  .overlay .close { position: absolute; top: calc(40px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }

  @media (max-width: 760px) {
    nav.main { display: none; }
    .menu-btn { display: block; }
  }

  /* Pages */
  main { margin-top: 72px; transition: opacity .35s ease; }
  main.fading { opacity: 0; }
  .page { max-width: 1100px; margin: 0 auto; }
  .narrow { max-width: 640px; margin: 0 auto; }
  h1.page-title {
    font-family: var(--sans); font-weight: 400; font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--link); text-align: center; margin: 0 0 64px;
  }
  .caption { font-size: 12px; color: var(--caption); margin-top: 14px; line-height: 1.5; }
  .center { text-align: center; }

  /* Media */
  .media { width: 90%; max-width: 1100px; margin: 0 auto; }
  .frame16 {
    position: relative; display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 9;
    background: var(--frame); overflow: hidden;
  }
  .frame16 img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame16 iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .play {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  }
  .play span {
    width: 0; height: 0; border-style: solid; border-width: 14px 0 14px 24px;
    border-color: transparent transparent transparent var(--link); opacity: .85; transition: opacity .25s ease;
  }
  .frame16:hover .play span { opacity: 1; border-left-color: var(--active); }

  img.lazy { opacity: 0; transition: opacity .6s ease; }
  img.lazy.in { opacity: 1; }

  /* Index grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 96px 88px;
    max-width: 900px; margin: 0 auto;
  }
  .grid a { display: block; text-align: center; }
  .grid .thumb { aspect-ratio: 1 / 1; width: 100%; max-width: 100%; background: var(--frame); overflow: hidden; }
  .grid .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .grid .t { display: block; margin-top: 14px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--link); }
  .grid a:hover .t { color: var(--active); }

  /* Series */
  .series .works { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 64px 56px; }
  .series figure { margin: 0; text-align: center; max-width: 100%; }
  .series figure img { display: block; margin: 0 auto; height: min(40vh, 360px); width: auto; max-width: 100%; object-fit: contain; cursor: zoom-in; }
  .series .back { display: block; text-align: center; margin-top: 112px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }

  /* Enlarged view */
  .viewer {
    position: fixed; inset: 0; z-index: 30; background: var(--wall);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    opacity: 0; pointer-events: none; transition: opacity .3s ease; cursor: zoom-out;
  }
  .viewer.open { opacity: 1; pointer-events: auto; }
  .viewer img { max-width: 100%; max-height: 84vh; width: auto; height: auto; display: block; }
  .series-intro { max-width: 600px; margin: -24px auto 88px; font-size: 13px; line-height: 1.85; color: var(--link); text-wrap: pretty; }
  .series-intro em { font-style: italic; }

  /* Video */
  .videos .media { margin-bottom: 140px; }
  .video-desc { max-width: 640px; margin: 28px auto 0; font-size: 13px; line-height: 1.8; color: var(--caption); }

  /* Home reel: the recent films crossfade into each other, each still drifting slowly closer. */
  .reel { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: var(--frame); overflow: hidden; }
  .reel .frame16 { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity 1.4s ease; }
  .reel .frame16.on { opacity: 1; pointer-events: auto; }
  .reel .frame16.photo { background: var(--wall); }
  .reel .frame16.photo img { object-fit: contain; }
  .reel .frame16 img { transform: scale(1); transform-origin: 50% 50%; }
  .reel .frame16.on img.in { animation: drift 5s linear forwards; }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.07); } }
  .reel-caps { display: grid; }
  .reel-caps .caption { grid-area: 1 / 1; opacity: 0; transition: opacity 1.4s ease; }
  .reel-caps .caption.on { opacity: 1; }
  .reel-dots { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }
  .reel-dots button { width: 28px; height: 14px; padding: 0; border: 0; background: none; cursor: pointer; position: relative; }
  .reel-dots button::after { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 1px; background: var(--link); opacity: .45; transition: opacity .3s ease, background .3s ease; }
  .reel-dots button[aria-current="true"]::after { opacity: 1; background: var(--active); }
  @media (prefers-reduced-motion: reduce) { .reel .frame16.on img.in { animation: none; } }

  /* Text pages */
  .text h2 {
    font-family: var(--sans); font-weight: 400; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--link); margin: 72px 0 20px;
  }
  .text h2:first-child { margin-top: 0; }
  .text p { margin: 0 0 18px; }
  .chron { list-style: none; margin: 0; padding: 0; }
  .chron li { display: grid; grid-template-columns: 88px 1fr; gap: 16px; margin-bottom: 10px; }
  .chron li span:first-child { font-variant-numeric: tabular-nums; color: var(--caption); }
  .chron li span:last-child { min-width: 0; }
  .chron a, .series-intro a { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .contact p { margin: 0 0 40px; }
  .contact .label { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--caption); margin-bottom: 4px; }
  .note { font-size: 11px; color: var(--caption); margin-top: 8px; }

  @media (max-width: 520px) {
    main { margin-top: 56px; }
    .media { width: 100%; }
    .grid { gap: 72px; grid-template-columns: 1fr; max-width: 320px; }
    .series .works { gap: 32px 16px; align-items: flex-start; }
    .series figure { flex: 0 0 calc(50% - 8px); }
    .series figure img { width: 100%; height: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>


<header>
  <a class="wordmark" href="#home">Pich Sann</a>
  <nav class="main" id="nav" aria-label="Main"></nav>
  <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="overlay">Menu</button>
  <div class="lang-row" id="langRow">
    <button class="lang" data-lang="en" aria-pressed="true">English</button>
    <button class="lang" data-lang="fr" aria-pressed="false" lang="fr">Français</button>
    <button class="lang" data-lang="ja" aria-pressed="false" lang="ja">日本語</button>
    <button class="lang" data-lang="km" aria-pressed="false" lang="km">ខ្មែរ</button>
  </div>
</header>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Menu">
  <button class="menu-btn close" id="closeBtn" style="display:inline-block">Close</button>
  <div id="overlayLinks" style="display:flex;flex-direction:column;align-items:center;gap:22px"></div>
</div>

<main id="main"></main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Enlarged artwork">
  <img id="viewerImg" alt="">
  <div class="caption" id="viewerCap"></div>
</div>

<script>
(function () {
  var NAV = [
    { id: "home", en: "Home", fr: "Accueil", ja: "ホーム", km: "ទំព័រដើម" },
    { id: "artworks", en: "Artworks", fr: "Œuvres", ja: "作品", km: "ស្នាដៃសិល្បៈ" },
    { id: "video", en: "Video", fr: "Vidéo", ja: "映像", km: "វីដេអូ" },
    { id: "biography", en: "Biography", fr: "Biographie", ja: "略歴", km: "ជីវប្រវត្តិ" },

  var lang = "en";

  /* ---------- placeholder images (flat greys, drawn as SVG) ---------- */
  function svg(w, h, body, bg) {
    var s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
      '<rect width="100%" height="100%" fill="' + bg + '"/>' + body + '</svg>';
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
  }
  var motifs = {
    horizon: function (w, h, i) {
      var y = h * (0.5 + (i % 3 - 1) * 0.02);
      return svg(w, h, '<rect y="' + y + '" width="' + w + '" height="' + (h - y) + '" fill="' + ["#5c5c5c", "#4f4f4f", "#666"][i % 3] + '"/>', ["#a3a3a3", "#9a9a9a", "#b0b0b0"][i % 3]);
    },
    screen: function (w, h, i) {
      var sw = w * 0.42, sh = sw * 0.45;
      return svg(w, h, '<rect x="' + (w - sw) / 2 + '" y="' + h * 0.3 + '" width="' + sw + '" height="' + sh + '" fill="#e6e6e6"/>' +
        '<rect y="' + h * 0.78 + '" width="' + w + '" height="' + h * 0.22 + '" fill="#2b2b2b"/>', ["#3a3a3a", "#343434", "#404040"][i % 3]);
    },
    bolt: function (w, h, i) {
      var x = w * (0.35 + 0.1 * (i % 3)), pts = [], y = 0;
      while (y < h) { pts.push(x.toFixed(0) + "," + y.toFixed(0)); x += (Math.sin(y * 0.07 + i) * 24); y += h / 14; }
      pts.push(x.toFixed(0) + "," + h);
      return svg(w, h, '<polyline points="' + pts.join(" ") + '" fill="none" stroke="#d8d8d8" stroke-width="1.6"/>', "#1f1f1f");
    },
    diorama: function (w, h, i) {
      return svg(w, h, '<rect y="' + h * 0.72 + '" width="' + w + '" height="' + h * 0.28 + '" fill="#6b6b6b"/>' +
        '<rect x="' + w * (0.3 + 0.08 * (i % 3)) + '" y="' + h * 0.48 + '" width="' + w * 0.1 + '" height="' + h * 0.26 + '" fill="#454545"/>' +
        '<rect x="' + w * 0.56 + '" y="' + h * 0.58 + '" width="' + w * 0.16 + '" height="' + h * 0.15 + '" fill="#555"/>', "#8c8c8c");
    },
    blocks: function (w, h, i) {
      return svg(w, h, '<rect x="' + w * 0.2 + '" y="' + h * (0.18 + 0.03 * i) + '" width="' + w * 0.34 + '" height="' + h * 0.82 + '" fill="#8a8a8a"/>' +
        '<rect x="' + w * 0.58 + '" y="' + h * 0.38 + '" width="' + w * 0.22 + '" height="' + h * 0.62 + '" fill="#9d9d9d"/>', "#c4c4c4");
    },
    room: function (w, h, i) {
      return svg(w, h, '<polygon points="0,' + h + ' ' + w * 0.3 + ',' + h * 0.62 + ' ' + w * 0.7 + ',' + h * 0.62 + ' ' + w + ',' + h + '" fill="#6e6e6e"/>' +
        '<rect x="' + w * 0.3 + '" y="' + h * 0.2 + '" width="' + w * 0.4 + '" height="' + h * 0.42 + '" fill="' + ["#b9b9b9", "#a8a8a8", "#c6c6c6"][i % 3] + '"/>', "#888");
    },
    stone: function (w, h, i) {
      return svg(w, h, '<rect y="' + h * 0.66 + '" width="' + w + '" height="' + h * 0.34 + '" fill="#9b9b9b"/>' +
        '<rect x="' + w * (0.44 + 0.03 * i) + '" y="' + h * 0.3 + '" width="' + w * 0.06 + '" height="' + h * 0.36 + '" fill="#4d4d4d"/>', "#b5b5b5");
    }
  };

  /* ---------- content ---------- */
  var GIRL_INTRO = "<em>Girl</em> is a small series of photographs taken while filming <a href=\"#video\"><em>What Time Leaves Behind</em></a>. Between takes, the nature around me caught my attention, and I tried to capture the same atmosphere as the film, but this time in still images.";
  var ANALYSIS_INTRO = "<em>Canvas Analysis</em> is a series of scans of the canvases used in <em>Canvas</em>. Seen flat and without a body, the fabric shows the transferred photographs on their own: partly faded, sometimes only in fragments.";
  var BOY_INTRO = "<em>Boy</em> begins with my parents’ story. When they came to Belgium from Cambodia for the first time, they carried a briefcase full of books, everything they had to learn about a new country: its language, its culture, its way of life. In this series, a boy carries that same briefcase through old stone walls and overgrown ruins, searching for something new. He is not looking back; he is trying to leave his past behind him and walk towards a future he does not know yet. <em>Boy</em> is about that moment of crossing over, between the weight of what you bring with you and what you are ready to let go.";
  var AMELIE_INTRO = "After <em>Canvas</em>, I wanted to go one layer deeper. I printed the photographs from that series onto canvas and laid them back on the body, so that every image began to hold another one inside it: a picture within a picture, a person within a person. The more layers I added, the more the work turned towards something quieter, the unease of being undressed, of having only a thin piece of fabric between yourself and whoever is looking. <em>Amelie</em> became that in-between moment: an idea I followed for a while, until it slowly faded and opened the way to <em>Boy</em>.";
  var CANVAS_INTRO = "<em>Canvas</em> is a series of photographs made for my end-of-year exam, about how close skin and canvas are to each other. We cover ourselves with fabric as a protective layer: it hides who we are, but it also gives us a feeling of comfort and safety. The prints began on ramps and ledges, in the scratches and scrapes left by everyone who jumped, slid and fell there before. Transferred onto recycled canvas and laid on the body, those traces become, like <em>What Time Leaves Behind</em>, a record of what the past leaves behind.";
  /* Every visible string is a pair [English, Japanese]; Khmer lives in KM, keyed by the English text.
     L() picks the current language and falls back to English where no translation exists. */
  var KM = {
    "Menu": "ម៉ឺនុយ", "Close": "បិទ", "Play video: ": "ចាក់វីដេអូ៖ ",
    "Artworks": "ស្នាដៃសិល្បៈ", "Video": "វីដេអូ",
    "Biography": "ជីវប្រវត្តិ", "Works": "បញ្ជីស្នាដៃ", "Contact": "ទំនាក់ទំនង",
    "Back to Artworks": "ត្រឡប់ទៅស្នាដៃសិល្បៈ",
    "Canvas": "ផ្ទាំងក្រណាត់", "Canvas I": "ផ្ទាំងក្រណាត់ I", "Canvas II": "ផ្ទាំងក្រណាត់ II", "Canvas III": "ផ្ទាំងក្រណាត់ III",
    "Canvas IV": "ផ្ទាំងក្រណាត់ IV", "Canvas V": "ផ្ទាំងក្រណាត់ V", "Boy": "ក្មេងប្រុស",
    "Boy I": "ក្មេងប្រុស I", "Boy II": "ក្មេងប្រុស II", "Boy III": "ក្មេងប្រុស III", "Boy IV": "ក្មេងប្រុស IV",
    "Boy V": "ក្មេងប្រុស V", "Boy VI": "ក្មេងប្រុស VI", "Boy VII": "ក្មេងប្រុស VII",
    "Canvas I, 2025": "ផ្ទាំងក្រណាត់ I, 2025", "Boy I, 2026": "ក្មេងប្រុស I, 2026", "Amelie III, 2026": "Amelie III, 2026",
    "Canvas Analysis": "ការវិភាគផ្ទាំងក្រណាត់", "Canvas Analysis I": "ការវិភាគផ្ទាំងក្រណាត់ I", "Canvas Analysis II": "ការវិភាគផ្ទាំងក្រណាត់ II",
    "Canvas Analysis III": "ការវិភាគផ្ទាំងក្រណាត់ III", "Canvas Analysis IV": "ការវិភាគផ្ទាំងក្រណាត់ IV", "Canvas Analysis V": "ការវិភាគផ្ទាំងក្រណាត់ V",
    "Canvas Analysis VI": "ការវិភាគផ្ទាំងក្រណាត់ VI",
    "Girl": "ក្មេងស្រី", "Girl I": "ក្មេងស្រី I", "Girl II": "ក្មេងស្រី II",
    "What Time Leaves Behind, a film by Pich Sann, end-of-year project, Kunstinstituut Gent, 2026": "អ្វីដែលពេលវេលាបន្សល់ទុក ខ្សែភាពយន្តដោយ Pich Sann គម្រោងបញ្ចប់ឆ្នាំសិក្សា Kunstinstituut Gent, 2026",
    "A girl moves through the things my parents carried with them when they came to Belgium. The books in this film were all they had to learn about their new country: its culture, its language, its ways of living. What Time Leaves Behind returns to these objects to ask what remains of a beginning, long after it has passed.":
      "ក្មេងស្រីម្នាក់ដើររុករកវត្ថុដែលឪពុកម្ដាយខ្ញុំបាននាំយកមកជាមួយ នៅពេលពួកគាត់មកដល់ប្រទេសបែលហ្ស៊ិក។ សៀវភៅនៅក្នុងខ្សែភាពយន្តនេះ គឺជាអ្វីៗទាំងអស់ដែលពួកគាត់មាន ដើម្បីស្វែងយល់ពីប្រទេសថ្មីរបស់ពួកគាត់៖ វប្បធម៌ ភាសា និងរបៀបរស់នៅ។ What Time Leaves Behind ត្រឡប់ទៅរកវត្ថុទាំងនេះវិញ ដើម្បីសួរថា តើអ្វីនៅសល់ពីការចាប់ផ្ដើមមួយ យូរបន្ទាប់ពីវាបានកន្លងផុតទៅ។",
    "Pich Sann is a photographer and video artist based in Belgium, with a passion for skateboarding. He began secondary school in 2019 at Don Bosco Halle, studying graphic design, and in 2022 moved to Sint-Lukas Brussels to study audiovisual and visual arts, graduating in 2025. He then studied photography at Kunstinstituut Gent, graduating in 2026, and now continues his photography studies at Narafi in Brussels.":
      "Pich Sann គឺជាអ្នកថតរូប និងជាសិល្បករវីដេអូ ដែលធ្វើការនៅប្រទេសបែលហ្ស៊ិក និងមានចំណង់ចំណូលចិត្តលើការជិះស្គេត។ គាត់បានចាប់ផ្ដើមមធ្យមសិក្សាផ្នែករចនាក្រាហ្វិកនៅ Don Bosco Halle ក្នុងឆ្នាំ 2019 ហើយនៅឆ្នាំ 2022 បានប្ដូរទៅ Sint-Lukas Brussels ដើម្បីសិក្សាផ្នែកសោតទស្សន៍ និងសិល្បៈ ហើយបានបញ្ចប់ការសិក្សានៅឆ្នាំ 2025។ បន្ទាប់មក គាត់បានសិក្សាផ្នែកថតរូបនៅ Kunstinstituut Gent ហើយបានបញ្ចប់នៅឆ្នាំ 2026 ហើយបច្ចុប្បន្នកំពុងបន្តសិក្សាផ្នែកថតរូបនៅ Narafi ក្នុងទីក្រុងព្រុចសែល។",
    "He started skateboarding in 2020. It gave him another way of seeing: an eye for the city, for movement, and for the moments in between, which carries through into both his photographs and his films.":
      "គាត់បានចាប់ផ្ដើមជិះស្គេតក្នុងឆ្នាំ 2020 ដែលបានផ្ដល់ឱ្យគាត់នូវរបៀបមើលមួយទៀត៖ ការសម្លឹងមើលទីក្រុង ចលនា និងពេលវេលាតូចៗនៅចន្លោះ ដែលឆ្លុះបញ្ចាំងទាំងនៅក្នុងរូបថត និងខ្សែភាពយន្តរបស់គាត់។",

    { caption: ["Screenagers, skate film, filmed and edited by Pich Sann, MAS3_Skate, 2026", "『Screenagers』スケートフィルム、撮影・編集：ピッチ・サン、MAS3_Skate、2026年"], tone: 1,
      url: "https://www.youtube.com/watch?v=aHuBJSIDJx0&t=153s", yt: "aHuBJSIDJx0", start: 153, cover: "video-cover-2.jpg",
      desc: ["A skate film about a group of friends and the time they spend together: skating through the city, waiting on stairs, and filming each other in between. I filmed and edited the whole video and skated as part of the crew. It began as a project between friends and went on to become a viral video. Thanks to local legend filmer Moica for assisting on the second angle.",
        "仲間たちと過ごす時間を描いたスケートフィルム。街を滑り、階段で待ち、その合間にお互いを撮り合う日々。撮影と編集のすべてを手がけ、クルーの一員としても滑った。友人同士のプロジェクトとして始まり、のちに多くの人に広まる映像となった。セカンドアングルの撮影をサポートしてくれた地元のレジェンド・フィルマー、Moicaに感謝。"] },
    { caption: ["Trial and Error, final art exam film, graduation Sint-Lukas Brussels, 2024–2025", "『Trial and Error』卒業試験の映像作品、シント・ルーカス・ブリュッセル、2024–2025年"], tone: 2,
      url: "https://www.youtube.com/watch?v=HaRn33wlNyM", yt: "HaRn33wlNyM", start: 0, cover: "video-cover-3.jpg",
      desc: ["My final art exam film for graduating from Sint-Lukas Brussels. <em>Trial and Error</em> follows the process of learning a new skateboarding trick, attempt after attempt.",
        "シント・ルーカス・ブリュッセルの卒業試験のために制作した映像作品。『Trial and Error』は、スケートボードの新しいトリックを身につけるまでの過程を、挑戦を重ねるごとに追っていく。"] }
  ];
  /* Home slideshow: photographs first, alternating with the two films. */
  var HOME_REEL = [
    { photo: "canvas.jpg", href: "#canvas", caption: ["Canvas I, 2025", "キャンバス I、2025年"] },
    VIDEOS[0],
    { photo: "boy.jpg", href: "#boy", caption: ["Boy I, 2026", "少年 I、2026年"] },
    VIDEOS[1],
    { photo: "amelie-3.jpg", href: "#amelie", caption: ["Amelie III, 2026", "Amelie III、2026年"] }
  ];

  /* ---------- helpers ---------- */
  function img(src, alt, cls) {
    return '<img class="lazy ' + (cls || "") + '" loading="lazy" decoding="async" alt="' + alt + '" src="' + src + '">';
  }
  /* Videos open on YouTube in a new tab; the artifact frame cannot embed other sites. */
  function videoBlock(v, withDesc) {
    var poster = v.cover || motifs.horizon(1600, 900, v.tone);
    return '<div class="media">' +
      '<a class="frame16" href="' + v.url + '" data-yt="' + v.yt + '" data-start="' + (v.start || 0) + '" target="_blank" rel="noopener" aria-label="' + L(["Play video: ", "動画を再生："]) + L(v.caption) + '">' +
      img(poster, "") + '<span class="play"><span></span></span></a>' +
      '<div class="caption center">' + L(v.caption) + '</div>' +
      (withDesc && v.desc ? '<p class="video-desc">' + L(v.desc) + '</p>' : '') + '</div>';
  }
  function reelBlock(list) {
    return '<div class="media"><div class="reel">' +
      list.map(function (v, i) {
        // Photos open their series page; films open YouTube.
        var link = v.photo ? '" href="' + v.href + '" aria-label="' + L(v.caption)
          : '" href="' + v.url + '" target="_blank" rel="noopener" aria-label="' + L(["Play video: ", "動画を再生："]) + L(v.caption);
        return '<a class="frame16' + (v.photo ? ' photo' : '') + (i === 0 ? ' on' : '') + link + '"' + (i === 0 ? '' : ' tabindex="-1"') + '>' +
          img(v.photo || v.cover || motifs.horizon(1600, 900, v.tone), "") + (v.photo ? '' : '<span class="play"><span></span></span>') + '</a>';
      }).join("") + '</div>' +
      '<div class="reel-caps">' + list.map(function (v, i) {
        return '<div class="caption center' + (i === 0 ? ' on' : '') + '">' + L(v.caption) + '</div>';
      }).join("") + '</div>' +
      (list.length > 1 ? '<div class="reel-dots">' + list.map(function (v, i) {
        return '<button type="button" data-i="' + i + '" aria-label="' + L(v.caption) + '" aria-current="' + (i === 0) + '"></button>';
      }).join("") + '</div>' : '') + '</div>';
  }

  /* ---------- home reel ---------- */
  var reelTimer = null;
  function showSlide(reel, n) {
    var slides = reel.querySelectorAll(".reel .frame16"), caps = reel.querySelectorAll(".reel-caps .caption"), dots = reel.querySelectorAll(".reel-dots button");
    for (var i = 0; i < slides.length; i++) {
      var on = i === n;
      slides[i].classList.toggle("on", on);
      slides[i].tabIndex = on ? 0 : -1;
      caps[i].classList.toggle("on", on);
      if (dots[i]) dots[i].setAttribute("aria-current", String(on));
      // Restart the slow drift on the incoming still.
      var im = slides[i].querySelector("img");
      if (on && im) { im.style.animation = "none"; void im.offsetWidth; im.style.animation = ""; }
    }
    reel.dataset.i = n;
  }
  function startReel() {
    clearInterval(reelTimer);
    var reel = main.querySelector(".reel");
    if (!reel || reel.querySelectorAll(".frame16").length < 2) return;
    var box = reel.parentNode, count = reel.querySelectorAll(".frame16").length, paused = false;
    box.dataset.i = 0;
    function next() { if (!paused) showSlide(box, (Number(box.dataset.i) + 1) % count); }
    reelTimer = setInterval(next, 4500);
    reel.addEventListener("mouseenter", function () { paused = true; });
    reel.addEventListener("mouseleave", function () { paused = false; });
    box.addEventListener("click", function (e) {
      var b = e.target.closest(".reel-dots button");
      if (!b) return;
      showSlide(box, Number(b.dataset.i));
      clearInterval(reelTimer);
      reelTimer = setInterval(next, 4500);
    });
  }

  function indexPage(list, heading) {
    return '<section class="page"><h1 class="page-title">' + L(heading) + '</h1><div class="grid">' +
      list.map(function (s) {
        return '<a href="#' + s.id + '"><div class="thumb">' + img(s.src || motifs[s.motif](600, 600, 0), "") + '</div><span class="t">' + L(s.title) + '</span></a>';
      }).join("") + '</div></section>';
  }
  function seriesPage(s, backId, backLabel) {
    var tall = s.motif === "blocks" || s.motif === "bolt";
    return '<section class="page series"><h1 class="page-title">' + L(s.title) + '</h1>' +
      (s.intro ? '<p class="series-intro">' + L(s.intro) + '</p>' : '') + '<div class="works">' +
      s.works.map(function (w, i) {
        var src = w[2] || (tall ? motifs[s.motif](1000, 1250, i) : motifs[s.motif](1500, 1150, i));
        var year = w[1] ? (lang === "ja" ? w[1] + "年" : w[1]) : "";
        var cap = [L(w[0]), year, s.medium ? L(s.medium) : ""].filter(Boolean).join(lang === "ja" ? "、" : ", ");
        return '<figure>' + img(src, L(w[0])) + '<figcaption class="caption">' + cap + '</figcaption></figure>';
      }).join("") + '</div>' +
      '<a class="back" href="#' + backId + '">' + L(backLabel) + '</a></section>';
  }
  function chron(rows) {
    return '<ul class="chron">' + rows.map(function (r) { return '<li><span>' + r[0] + '</span><span>' + L(r[1]) + '</span></li>'; }).join("") + '</ul>';
  }
  function h(title) { return '<h2>' + L(title) + '</h2>'; }

  /* ---------- pages ---------- */
  var PAGES = {
    home: function () { return '<section class="page">' + reelBlock(HOME_REEL) + '</section>'; },
    artworks: function () { return indexPage(ARTWORKS, ["Artworks", "作品"]); },
    video: function () {
      return '<section class="page videos"><h1 class="page-title">' + L(["Video", "映像"]) + '</h1>' + VIDEOS.map(function (v) { return videoBlock(v, true); }).join("") + '</section>';
    },
    biography: function () {
      return '<section class="narrow text"><h1 class="page-title">' + L(["Biography", "略歴"]) + '</h1>' +
        '<p>' + L(["Pich Sann is a photographer and video artist based in Belgium, with a passion for skateboarding. He began secondary school in 2019 at Don Bosco Halle, studying graphic design, and in 2022 moved to Sint-Lukas Brussels to study audiovisual and visual arts, graduating in 2025. He then studied photography at Kunstinstituut Gent, graduating in 2026, and now continues his photography studies at Narafi in Brussels.",
          "ピッチ・サンは、ベルギーを拠点に活動する写真家・映像作家。スケートボードに情熱を注ぐ。2019年にドン・ボスコ・ハレの中等教育課程でグラフィックデザインを学び始め、2022年にシント・ルーカス・ブリュッセルへ移ってオーディオビジュアル・アートを専攻し、2025年に卒業。その後クンストインスティテュート・ゲントで写真を学んで2026年に卒業し、現在はブリュッセルのナラフィで写真を学び続けている。"]) + '</p>' +
        '<p>' + L(["He started skateboarding in 2020. It gave him another way of seeing: an eye for the city, for movement, and for the moments in between, which carries through into both his photographs and his films.",
          "2020年にスケートボードを始めたことで、物の見方にもうひとつの視点が加わった。街、動き、そしてその間にある瞬間へのまなざしは、写真と映像の両方に通じている。"]) + '</p>' +
        h(["Education", "学歴"]) + chron([
          ["2026–", ["Photography, Narafi, Brussels (current)", "写真専攻、ナラフィ、ブリュッセル（在学中）"]],
          ["2025–2026", ["Photography, Kunstinstituut Gent", "写真専攻、クンストインスティテュート・ゲント"]],
          ["2022–2025", ["Audiovisual and Visual Arts, Sint-Lukas Brussels", "オーディオビジュアル・アート専攻、シント・ルーカス・ブリュッセル"]],
          ["2019–2022", ["Graphic Design, Don Bosco Halle", "グラフィックデザイン専攻、ドン・ボスコ・ハレ"]]]) +
        h(["Exhibitions", "展覧会"]) + chron([
          ["2026", ["End-of-year exhibition, Kunstinstituut Gent (open to the public)", "学年末展、クンストインスティテュート・ゲント（一般公開）"]],
          ["2025", ["Graduation exhibition, Sint-Lukas Brussels (open to the public)", "卒業展、シント・ルーカス・ブリュッセル（一般公開）"]]]) +
        '</section>';
    },
    works: function () {
      return '<section class="narrow text"><h1 class="page-title">' + L(["Works", "作品リスト"]) + '</h1>' +
        h(["Film", "映像作品"]) + chron([
          ["2026", ["<a href=\"#video\">Screenagers</a>, skate film, filmed and edited", "<a href=\"#video\">『Screenagers』</a>スケートフィルム、撮影・編集"]],
          ["2026", ["<a href=\"#video\">What Time Leaves Behind</a>, end-of-year project, Kunstinstituut Gent", "<a href=\"#video\">『時が残すもの』</a>、学年末制作、Kunstinstituut Gent"]],
          ["2024–2025", ["<a href=\"#video\">Trial and Error</a>, final art exam film, Sint-Lukas Brussels", "<a href=\"#video\">『Trial and Error』</a>、卒業試験の映像作品、シント・ルーカス・ブリュッセル"]]]) +
        h(["Photographic Series", "写真シリーズ"]) + chron([
          ["2025", ["<a href=\"#canvas\">Canvas</a>, 5 photographs", "<a href=\"#canvas\">キャンバス</a>、写真5点"]],
          ["2026", ["<a href=\"#amelie\">Amelie</a>, 4 photographs", "<a href=\"#amelie\">Amelie</a>、写真4点"]],
          ["2026", ["<a href=\"#boy\">Boy</a>, 7 photographs", "<a href=\"#boy\">少年</a>、写真7点"]],
          ["2025", ["<a href=\"#canvas-analysis\">Canvas Analysis</a>, 6 works", "<a href=\"#canvas-analysis\">キャンバス分析</a>、作品6点"]],
          ["2026", ["<a href=\"#girl\">Girl</a>, 2 photographs, taken while filming What Time Leaves Behind", "<a href=\"#girl\">少女</a>、写真2点、『時が残すもの』撮影中に撮影"]]]) +
        '</section>';
    },
    contact: function () {
      return '<section class="narrow text contact"><h1 class="page-title">' + L(["Contact", "お問い合わせ"]) + '</h1>' +
        '<p><span class="label">' + L(["Email", "メール"]) + '</span><span style="user-select:all">pichsannz@gmail.com</span></p>' +
        '<p><span class="label">Instagram</span><a href="https://www.instagram.com/pek.oo0z/" target="_blank" rel="noopener">@pek.oo0z</a></p>' +
        '</section>';
    }
  };
  ARTWORKS.forEach(function (s) { PAGES[s.id] = function () { return seriesPage(s, "artworks", ["Back to Artworks", "作品一覧へ戻る"]); }; s.parent = "artworks"; });
  function parentOf(id) {
    var all = ARTWORKS;
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i].parent;
    return id;
  }

  /* ---------- nav ---------- */
  var navEl = document.getElementById("nav");
  var overlayLinks = document.getElementById("overlayLinks");
  var overlay = document.getElementById("overlay");
  var menuBtn = document.getElementById("menuBtn");
  function renderNav(current) {
    var active = parentOf(current);
    var html = NAV.map(function (n) {
      return '<a href="#' + n.id + '"' + (n.id === active ? ' aria-current="page"' : "") + '>' + n[lang] + '</a>';
    }).join("");
    navEl.innerHTML = html;
    overlayLinks.innerHTML = html;
  }
  function setMenu(open) {
    overlay.classList.toggle("open", open);
    menuBtn.setAttribute("aria-expanded", String(open));
    document.body.style.overflow = open ? "hidden" : "";
  }
  menuBtn.addEventListener("click", function () { setMenu(true); });
  document.getElementById("closeBtn").addEventListener("click", function () { setMenu(false); });
  overlayLinks.addEventListener("click", function (e) { if (e.target.closest("a")) setMenu(false); });
  /* ---------- enlarged view ---------- */
  var viewer = document.getElementById("viewer");
  var viewerImg = document.getElementById("viewerImg");
  function setViewer(open) {
    viewer.classList.toggle("open", open);
    document.body.style.overflow = open ? "hidden" : "";
  }
  document.getElementById("main").addEventListener("click", function (e) {
    var im = e.target.closest(".series figure img");
    if (!im) return;
    viewerImg.src = im.src;
    viewerImg.alt = im.alt;
    document.getElementById("viewerCap").textContent = im.nextElementSibling ? im.nextElementSibling.textContent : "";
    setViewer(true);
  });
  viewer.addEventListener("click", function () { setViewer(false); });

  /* Self-hosted (e.g. GitHub Pages) the page is the top window and YouTube can play in place;
     inside the claude.ai frame embedding is blocked, so the link opens YouTube instead. */
  document.getElementById("main").addEventListener("click", function (e) {
    var a = e.target.closest(".videos .frame16[data-yt]");
    if (!a || window.self !== window.top) return;
    e.preventDefault();
    a.outerHTML = '<div class="frame16"><iframe src="https://www.youtube-nocookie.com/embed/' + a.dataset.yt +
      '?autoplay=1&start=' + a.dataset.start + '" title="' + a.getAttribute("aria-label") +
      '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>';
  });

  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { setMenu(false); setViewer(false); } });

  var langRow = document.getElementById("langRow");
  function setLang(next) {
    lang = next;
    document.documentElement.lang = lang;
    langRow.querySelectorAll(".lang").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === lang)); });
    menuBtn.textContent = L(["Menu", "メニュー"]);
    document.getElementById("closeBtn").textContent = L(["Close", "閉じる"]);
    var y = window.scrollY;
    render(false);
    window.scrollTo(0, y);
  }
  langRow.addEventListener("click", function (e) {
    var b = e.target.closest(".lang");
    if (b && b.dataset.lang !== lang) setLang(b.dataset.lang);
  });

  /* ---------- router + fade ---------- */
  var main = document.getElementById("main");
  function current() {
    var h = location.hash.replace("#", "");
    return PAGES[h] ? h : "home";
  }
  function fadeImages() {
    main.querySelectorAll("img.lazy").forEach(function (im) {
      if (im.complete) requestAnimationFrame(function () { im.classList.add("in"); });
      else im.addEventListener("load", function () { im.classList.add("in"); }, { once: true });
    });
  }
  function render(animate) {
    var id = current();
    var draw = function () {
      main.innerHTML = PAGES[id]();
      renderNav(id);
      fadeImages();
      startReel();
      window.scrollTo(0, 0);
      main.classList.remove("fading");
    };
    if (animate) { main.classList.add("fading"); setTimeout(draw, 200); } else draw();
  }
  window.addEventListener("hashchange", function () { render(true); });
  render(false);
})();
</script>

</body>
</html>
