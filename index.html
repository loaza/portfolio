<meta property="og:type" content="website">
<meta property="og:site_name" content="Pich Sann">
<meta property="og:title" content="Pich Sann — photography and film">
<meta property="og:description" content="The website is being updated and will be back soon.">
<meta property="og:url" content="https://ideaspot.online/">
<meta property="og:image" content="https://ideaspot.online/pictures/canvas/canvas.jpg">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23141414'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Georgia,serif' font-size='28' letter-spacing='2' fill='%23ecebe6'%3EPS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500&family=Jost:wght@300;400&family=Kantumruy+Pro:wght@300&display=swap">
<style>
  /* Holding page while the site is offline: same near-black wall and wordmark as the full site. */
  :root {
    --wall: #141414; --mark: #ecebe6; --link: #b9b9b4; --caption: #8f8f8a; --line: #2a2a28;
    --serif: "Cormorant SC", "Trajan Pro", Georgia, serif;
    --sans: "Futura PT", "Jost", "Kantumruy Pro", Futura, "Century Gothic", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--wall); }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    color: var(--link); font-family: var(--sans); font-weight: 300; font-size: 14px; line-height: 1.7;
    padding: 48px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
  }
  .wordmark {
    font-family: var(--serif); font-weight: 500; font-size: 22px; letter-spacing: .32em; margin: 0 -.32em 0 0;
    color: var(--mark); text-transform: uppercase;
  }
  .rule { width: 40px; height: 1px; background: var(--line); margin: 40px 0; }
  .status { margin: 0; font-size: 12px; font-weight: 400; letter-spacing: .16em; text-transform: uppercase; color: var(--mark); }
  .langs { margin: 18px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--caption); }
  .langs li + li { margin-top: 4px; }
  .contact { margin-top: 48px; font-size: 12px; letter-spacing: .04em; }
  .contact a { color: var(--link); text-decoration: none; border-bottom: 1px solid var(--line); transition: color .25s ease; }
  .contact a:hover, .contact a:focus-visible { color: var(--mark); }
  .contact a:focus-visible { outline: 1px solid var(--link); outline-offset: 4px; }
</style>
</head>
<body>
  <p class="wordmark">Pich Sann</p>
  <div class="rule"></div>
  <p class="status">Website under construction</p>
  <ul class="langs">
    <li lang="fr">Site en construction</li>
    <li lang="nl">Website in opbouw</li>
    <li lang="ja">ウェブサイト準備中</li>
    <li lang="km">គេហទំព័រកំពុងសាងសង់</li>
  </ul>
  <p class="contact">
    <span style="user-select:all">pichsannz@gmail.com</span><br>
    <a href="https://www.instagram.com/pek.oo0z/" target="_blank" rel="noopener">@pek.oo0z</a>
  </p>
</body>
</html>
